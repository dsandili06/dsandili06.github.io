<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <title>Página no encontrada</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        box-sizing: border-box;
        background: #080a0e;
        color: #edf2f7;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        text-align: center;
      }
      main {
        max-width: 28rem;
      }
      .code {
        margin: 0 0 0.5rem;
        font-size: 0.8rem;
        letter-spacing: 0.25em;
        color: #79acff;
      }
      h1 {
        margin: 0 0 1.5rem;
        font-size: 1.5rem;
        font-weight: 600;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 1.25rem;
        border: 1px solid #79acff;
        color: #79acff;
        text-decoration: none;
        font-size: 0.8rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }
      a:hover {
        background: #19212d;
      }
      a:focus-visible {
        outline: 2px solid #c5dcff;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">ERROR 404</p>
      <h1>Página no encontrada</h1>
      <a href="/">Volver al inicio</a>
    </main>
  </body>
</html>
